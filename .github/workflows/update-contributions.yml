name: Update contribution calendar

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public GitHub contributions
        run: python3 scripts/update-contributions.py
      - name: Commit updated calendar
        run: |
          if git diff --quiet -- data/contributions.json; then
            echo "Calendar is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json
          git commit -m "Update contribution calendar"
          git push
