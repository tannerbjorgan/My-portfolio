  <path d="M381 450h108M381 466h155M381 482h124" stroke="#7ce1ad" stroke-width="7" stroke-linecap="round"/>
  <text x="378" y="513" fill="#effff5" font-family="Arial,sans-serif" font-size="25" font-weight="700">LEXICAL SEARCH</text>
