  </defs>
  <rect width="1200" height="640" fill="url(#background)"/>
  <g fill="none" stroke="#253c4b" opacity=".7"><path d="M0 80h1200M0 160h1200M0 240h1200M0 320h1200M0 400h1200M0 480h1200M0 560h1200"/><path d="M80 0v640M160 0v640M240 0v640M320 0v640M400 0v640M480 0v640M560 0v640M640 0v640M720 0v640M800 0v640M880 0v640M960 0v640M1040 0v640M1120 0v640"/></g>
