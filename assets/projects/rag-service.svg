<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid retrieval pipeline</title>
  <desc id="desc">A query branches into vector and lexical search, merges results, and returns cited evidence.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0d1525"/><stop offset="1" stop-color="#172b38"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#52d6bf"/><stop offset="1" stop-color="#8fa9ff"/></linearGradient>
